version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: elldeeone-kas-rusty-kaspad-tn10_web_1
      APP_PORT: 4322

  web:
    image: nginx:stable-alpine@sha256:b9e1705b69f778dca93cbbbe97d2c2562fb26cac1079cdea4e40d1dad98f14fe
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ${APP_DATA_DIR}/data/web:/usr/share/nginx/html:ro

  node:
    image: supertypo/rusty-kaspad:v1.0.0@sha256:aa6226a66062fe9142c878b070e846a50ddb5ce14a957e95e62e539f32b9e28c
    restart: on-failure
    stop_grace_period: 1m
    command: kaspad --yes --nologfiles --disable-upnp --utxoindex --testnet --rpclisten=0.0.0.0:16210 --rpclisten-borsh=0.0.0.0:17210 --rpclisten-json=0.0.0.0:18210
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports:
      - 16210:16210  # GRPC
      - 16211:16211  # P2P
      - 17210:17210  # WRPC (Borsh)
      - 18210:18210  # WRPC (JSON)